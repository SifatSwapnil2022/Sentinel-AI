[project]
name = "sentinel-workspace"
version = "0.0.0"
description = "Workspace root for Sentinel. Not published."
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core", "server", "sdk/python"]

[tool.uv.sources]
sentinel-core = { workspace = true }
sentinel-server = { workspace = true }
sentinel-sdk = { workspace = true }

[dependency-groups]
dev = [
    "sentinel-core",
    "sentinel-server",
    "sentinel-sdk",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "scipy-stubs>=1.14",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["core/src", "core/tests", "server/src", "server/tests", "sdk/python/src", "sdk/python/tests", "demo"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "N",             # naming
    "C4",            # comprehensions
    "PT",            # pytest style
    "NPY",           # numpy-specific
    "PD",            # pandas-vet
    "PERF",          # performance anti-patterns
    "D",             # docstrings
]
ignore = [
    "D105", "D107",  # magic methods and __init__ documented on the class
    "PD011",         # flags every `.values`, including our own dataclass fields
    "N803", "N806",  # maths notation (X, TP, FP) is clearer than snake_case here
]

# Slice labels deliberately use typographic characters ("25k – 50k", "≥ 75k", "a · b").
allowed-confusables = ["–", "−", "≥", "·"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"core/tests/**" = ["D", "PLR2004", "N802"]
"server/tests/**" = ["D", "PLR2004", "N802"]
"sdk/python/tests/**" = ["D", "PLR2004", "N802"]
"server/src/sentinel_server/migrations/**" = ["D400", "D415"]  # Alembic's revision header format
"demo/**" = ["D1"]  # scripts: module docstrings explain them; helpers stay terse
"demo/build_llm.py" = ["D1", "E501"]  # the synthetic help-centre articles are long strings
"bi/**" = ["D1", "E501"]  # generators: DAX, M and XML read better on one line

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = ["core/src", "server/src", "sdk/python/src"]
files = ["core/src", "server/src", "sdk/python/src"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["core/tests", "server/tests", "sdk/python/tests"]
pythonpath = ["server/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-p", "no:cacheprovider",
    "--import-mode=importlib",
]
markers = [
    "parity: compares results with Evidently / NannyML (needs the parity extras)",
    "slow: long-running statistical tests",
]
filterwarnings = ["error", "ignore::DeprecationWarning:pandas.*"]

[tool.coverage.run]
source = ["sentinel_core", "sentinel_server", "sentinel_sdk"]
branch = true
# SQLAlchemy's asyncio layer resumes coroutines through greenlets; without this, code after
# every database await looks unexecuted.
concurrency = ["thread", "greenlet"]
# Migrations run at the start of every server test session, but Alembic loads them by file
# path, so coverage can't attribute them.
omit = ["*/sentinel_server/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
