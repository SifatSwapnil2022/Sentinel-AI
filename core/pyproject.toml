[project]
name = "sentinel-core"
version = "0.1.0"
description = "Monitoring maths for Sentinel: drift detection, label-free performance estimation, slice root cause."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Md Sifatullah Sheikh" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.4",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_core"]
