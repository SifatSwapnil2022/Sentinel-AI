[project]
name = "sentinel-sdk"
version = "0.1.0"
description = "Send predictions and labels to Sentinel from a model server, without slowing it down."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Md Sifatullah Sheikh" }]
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_sdk"]
