server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The API, on the same origin: no CORS, and no key needed in the browser when the API
    # runs with SENTINEL_PUBLIC_READ=true.
    location /v1/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fingerprinted assets never change; everything else is revalidated.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        try_files $uri /index.html;  # client-side routes
    }
}
